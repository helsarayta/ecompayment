spring.application.name=ecom-payment

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.kafka.bootstrap-servers= ${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=ecom-payment
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.heydie.ecompayment.payment.messaging.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.heydie.ecompayment.payment.messaging.dto.PaymentRequestedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.acks=all
spring.kafka.listener.ack-mode=manual
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true

midtrans.production=${MIDTRANS_PRODUCTION:false}
midtrans.server-key=${MIDTRANS_SERVER_KEY}
midtrans.snap-base-url=${MIDTRANS_SNAP_URL:https://app.sandbox.midtrans.com}
midtrans.api-base-url=${MIDTRANS_API_URL:https://api.sandbox.midtrans.com}
midtrans.connect-timeout=5s
midtrans.read-timeout=15s
midtrans.finish-redirect-url=${MIDTRANS_FINISH_URL:}

app.outbox.poll-interval=2s
app.reconciliation.interval=5m
app.reconciliation.stale-after=15m

spring.config.import=optional:file:./config/local.properties

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.kafka.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

app.kafka.topic.payment-request=payment.request.v1
app.kafka.topic.payment-created=payment.created.v1
app.kafka.topic.payment-result=payment.result.v1

